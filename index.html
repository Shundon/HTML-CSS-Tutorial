<!-- index.html -->
<!DOCTYPE html>
<!--htmlドキュメントの開始-->
<html lang="ja">
<!--このHTMLドキュメントの言語が日本語である-->
<head>
<!-- HTMLドキュメントのメタデータ（ページに関する情報）を含む部分 -->
    <meta charset="UTF-8">
    <!--文書の文字エンコーディングを指定 UTF-8-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ページの表示方法をモバイルデバイスに最適化するために使用content="width=device-width→デバイスの画面幅に合わせた表示を行うことを指定initial-scale=1.0→初期の拡大率を1倍に設定します。これにより、スマートフォンやタブレットでもページが適切に表示 -->
    <title>自己紹介サイト</title>
    <!-- ページタイトル -->
     <link rel="stylesheet" href="./style.css">
</head>
<body>
<!--コンテンツを表示させる部分-->
<img src="./image/profile_image.png" alt="プロフィール画像">
<h1>自己紹介</h1>
<p>こんにちは、私はWeb開発者です。</p>
<footer>&copy; 2025 Shunichi Mitsui</footer>

</body>
</html><!--htmlドキュメントの終了-->
